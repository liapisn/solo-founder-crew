name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.11,<3.14) and the project classifiers.
        # 3.10 is excluded: langgraph 1.x raises "get_config outside of a
        # runnable context" there — the framework targets 3.11+.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + runtime extras)
        # The runtime extra (discord.py + sqlite saver) is installed so the
        # importorskip-guarded transport + daemon tests run in CI, not skip.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,runtime]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ examples/

      - name: Test (pytest)
        run: pytest
