name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10,<3.14 (pyproject.toml).
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + discord extras)
        # The discord extra is installed so the importorskip-guarded
        # DiscordPyTransport tests actually run in CI rather than skip.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discord]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ examples/

      - name: Test (pytest)
        run: pytest
